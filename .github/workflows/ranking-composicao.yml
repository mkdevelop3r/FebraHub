# FebraHub · .github/workflows/ranking-composicao.yml
#
# Como cada franquia vende: origem do lead, mix de curso e tipo de matricula,
# por unidade e por mes. Alimenta o detalhe que abre ao clicar na franquia no
# Hub Executivo.
#
# SEPARADO DO RANKING DE PROPOSITO. Sao duas perguntas e duas fontes: o
# ranking le o dashboard (Conversao BC, formula CDF2) e este le SOQL agregado
# (SUM(Amount)). As metricas NAO batem, e mante-los em scripts distintos
# lembra disso a quem for mexer.
#
# Roda uma vez por dia, depois do ranking. Nao entra em
# `salesforce-data-sync`: nao toca em fato_base_alunos nem em
# fato_pagamento_base, e no Salesforce so faz SOQL de leitura.

name: Composicao das unidades

on:
  schedule:
    # 11h30 UTC = 8h30 em Salvador, meia hora depois do ranking.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      diagnostico:
        description: Mostrar a composicao sem gravar
        type: boolean
        default: false
      mes:
        description: 'Mes (AAAA-MM). Vazio = mes corrente da janela comercial'
        type: string
        required: false

concurrency:
  group: ranking-composicao
  cancel-in-progress: false

jobs:
  composicao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar composicao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_LOGIN_URL: ${{ secrets.SALESFORCE_LOGIN_URL }}
        run: >
          python etl/ranking_composicao_sync.py
          ${{ inputs.diagnostico && '--diagnostico' || '' }}
          ${{ inputs.mes && format('--mes {0}', inputs.mes) || '' }}
