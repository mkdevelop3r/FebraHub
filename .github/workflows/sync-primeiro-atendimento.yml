name: Primeiro atendimento dos leads

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: primeiro-atendimento-leads
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Medir primeiro atendimento humano
        env:
          BLACKCRM_TOKEN: ${{ secrets.BLACKCRM_TOKEN }}
          BLACKCRM_LOCATION_ID: ${{ secrets.BLACKCRM_LOCATION_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python etl/blackcrm_primeiro_atendimento_sync.py
